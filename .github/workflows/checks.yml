name: checks
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python3 -m py_compile server.py
      - run: python3 tools/selftest.py
  wallet-bundle:
    # proves web/stacks.js is exactly what the pinned sources in tools/wallet-bundle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: bash tools/wallet-bundle/build.sh
      - run: bash tools/btc-bundle/build.sh
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: no keys, seeds or private addresses in the repo
        run: |
          ! grep -rnEI --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude=stacks.js \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e '"privateKey"' \
            -e 'eyJhbGciOi[A-Za-z0-9_-]{20,}' \
            -e '192\.168\.[0-9]+\.[0-9]+' .

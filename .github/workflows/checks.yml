name: checks
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python3 -m py_compile server.py
      - run: python3 tools/selftest.py
  wallet-bundle:
    # proves web/stacks.js, web/btc.js and web/sol.js are exactly what the pinned sources in tools/ build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: bash tools/wallet-bundle/build.sh
      - run: bash tools/btc-bundle/build.sh
      - run: bash tools/sol-bundle/build.sh
  contract:
    # proves web/eth.js + web/eth-contract.json are what the pinned sources build, then tests the contract on a local chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with: { version: v1.8.3 }
      - run: bash tools/eth-bundle/build.sh
      - run: |
          anvil --silent &
          sleep 3
          node tools/eth-bundle/contract-test.mjs
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: no keys, seeds or private addresses in the repo
        run: |
          ! grep -rnEI --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude=stacks.js --exclude=btc.js --exclude=sol.js \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e '"privateKey"' \
            -e 'eyJhbGciOi[A-Za-z0-9_-]{20,}' \
            -e '192\.168\.[0-9]+\.[0-9]+' .

name: codeql
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "23 4 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    # GitHub's free code scanning is for public repositories; skip quietly while the repo is private
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      matrix: { language: [python, javascript-typescript] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore: [web/stacks.js, tools/wallet-bundle]
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
